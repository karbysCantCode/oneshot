<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26324f"/>
      <stop offset="1" stop-color="#121521"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf5a"/>
      <stop offset="0.5" stop-color="#ff6f91"/>
      <stop offset="1" stop-color="#6da7ff"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- lens ring -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="url(#lens)" stroke-width="6"/>
  <!-- aperture "1" / shutter blade -->
  <path d="M28 22 L35 18 V46" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- node sockets -->
  <circle cx="9" cy="32" r="4.5" fill="#ffcf5a" stroke="#121521" stroke-width="2"/>
  <circle cx="55" cy="32" r="4.5" fill="#6da7ff" stroke="#121521" stroke-width="2"/>
</svg>
